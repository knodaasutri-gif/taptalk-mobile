<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>TapTalk Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="speechDisplay" class="speech-display" aria-live="polite" aria-atomic="true">
      <button class="speech-stop-btn" id="stopSpeechBtn" type="button" aria-label="読み上げを停止">⏹ 停止</button>
      <span id="speechPlaceholder">カードをタップして発話 / マイクで文字起こし</span>
      <span id="speechText" hidden></span>
    </section>

    <label class="custom-text-label" for="customTextInput">自由入力（音声認識結果を修正できます）</label>
    <textarea id="customTextInput" rows="2" maxlength="200" placeholder="ここに入力、または音声入力してください"></textarea>
    <button class="btn btn-custom-speak" id="customSpeakBtn" type="button">🔊 入力した文を発話</button>

    <section class="action-bar" aria-label="操作">
      <button class="btn btn-mic" id="micBtn" type="button">🎤 音声入力</button>
      <button class="btn btn-add" id="addBtn" type="button">➕ カード作成</button>
      <button class="btn btn-manage" id="manageBtn" type="button" aria-pressed="false">⚙️ 編集</button>
    </section>

    <section id="calendarSection" class="calendar-section" hidden aria-labelledby="leaveHeading">
      <h1 id="leaveHeading">📅 日時を選んでワンタッチ連絡</h1>
      <label for="leaveDateInput">日付</label>
      <input type="date" id="leaveDateInput">
      <div class="quick-dates" aria-label="日付の簡易選択">
        <button type="button" data-quick-date="0">今日</button>
        <button type="button" data-quick-date="1">明日</button>
        <button type="button" data-quick-date="2">明後日</button>
      </div>
      <div class="time-picker-box">
        <label for="leaveTimeInput">⏰ 時間（任意）</label>
        <input type="time" id="leaveTimeInput">
      </div>
      <p class="section-note">種別をタップすると、発話してカードにも保存します。</p>
      <div class="type-grid" aria-label="連絡の種別">
        <button class="type-btn" type="button" data-leave-type="full">📅 終日お休み</button>
        <button class="type-btn" type="button" data-leave-type="late">⏱️ 遅刻</button>
        <button class="type-btn" type="button" data-leave-type="early">🏃 早退</button>
        <button class="type-btn" type="button" data-leave-type="am">🌅 午前休</button>
        <button class="type-btn" type="button" data-leave-type="pm">🌇 午後休</button>
        <button class="type-btn" type="button" data-leave-type="hospital">🏥 通院</button>
      </div>
    </section>

    <nav class="tabs" id="categoryTabs" aria-label="カードのカテゴリ"></nav>
    <section class="cards-grid" id="cardsGrid" aria-label="会話カード"></section>
  </main>

  <div class="modal" id="cardModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal-content" id="cardForm">
      <h2 id="modalTitle">新しいカードを追加</h2>
      <label for="modalCategory">カテゴリ</label>
      <select id="modalCategory" required></select>
      <label for="modalIcon">絵文字（アイコン）</label>
      <input type="text" id="modalIcon" maxlength="8" placeholder="例: ⏱️" value="💬">
      <label for="modalText">話す言葉（テキスト）</label>
      <textarea id="modalText" rows="3" maxlength="200" required placeholder="例: 電車遅延で遅れます"></textarea>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelModalBtn" type="button">キャンセル</button>
        <button class="btn btn-save" type="submit">保存</button>
      </div>
    </form>
  </div>

  <div id="toastMsg" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
